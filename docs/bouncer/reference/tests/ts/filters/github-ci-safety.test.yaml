cases:
  - name: a repo without Actions secrets may be pushed to
    steps:
      - request:
          method: POST
          url: https://github.com/myorg/myrepo.git/git-receive-pack
          git_push: [{ref: refs/heads/feature}]
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            body: '{"total_count": 0, "secrets": []}'
            expect_header: {Accept: application/vnd.github+json}
        expect: allow

  - name: a repo with Actions secrets is refused
    steps:
      - request:
          method: POST
          url: https://github.com/myorg/myrepo.git/git-receive-pack
          git_push: [{ref: refs/heads/feature}]
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            body: '{"total_count": 1, "secrets": [{"name": "DEPLOY_KEY"}]}'
        expect: deny
        expect_reason: "myorg/myrepo has Actions secrets"

  - name: ssh pushes are checked too
    steps:
      - ssh: {host: github.com, user: git, command: "git-receive-pack 'myorg/myrepo.git'", git_push: [{ref: refs/heads/feature}]}
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            body: '{"total_count": 3, "secrets": []}'
        expect: deny
        expect_reason: "has Actions secrets"

  - name: a lookup the policy denies refuses the push
    steps:
      - request:
          method: POST
          url: https://github.com/myorg/myrepo.git/git-receive-pack
          git_push: [{ref: refs/heads/feature}]
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            status: 403
            body: '{"message": "Resource not accessible by personal access token"}'
        expect: deny
        expect_reason: "answered 403"

  - name: a failed lookup refuses the push
    steps:
      - request:
          method: POST
          url: https://github.com/myorg/myrepo.git/git-receive-pack
          git_push: [{ref: refs/heads/feature}]
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            error: connection refused
        expect: deny
        expect_reason: "lookup for myorg/myrepo failed"

  - name: an answer without a count refuses the push
    steps:
      - request:
          method: POST
          url: https://github.com/myorg/myrepo.git/git-receive-pack
          git_push: [{ref: refs/heads/feature}]
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            body: '{"secrets": []}'
        expect: deny
        expect_reason: "did not answer a count"

  - name: fetches never look anything up
    steps:
      - request:
          method: POST
          url: https://github.com/myorg/myrepo.git/git-upload-pack
        expect: allow

  - name: api config changes the lookup host
    filter_config: {api: "https://ghe.example.com/api/v3/"}
    steps:
      - request:
          method: POST
          url: https://ghe.example.com/myorg/myrepo.git/git-receive-pack
          git_push: [{ref: refs/heads/feature}]
        subrequests:
          - url: https://ghe.example.com/api/v3/repos/myorg/myrepo/actions/secrets?per_page=1
            body: '{"total_count": 0}'
        expect: allow
