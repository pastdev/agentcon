cases:
  - name: gitlab merge, approved
    steps:
      - approve: true
        request: {method: PUT, url: "https://gitlab.com/api/v4/projects/mygroup%2Fmyproj/merge_requests/42/merge"}
        expect: allow
        expect_asked: true
  - name: gitlab merge, refused
    steps:
      - request: {method: PUT, url: "https://gitlab.com/api/v4/projects/7/merge_requests/42/merge"}
        expect: deny
        expect_reason: "MR !42 in 7"
  - name: github REST merge
    steps:
      - request: {method: PUT, url: "https://api.github.com/repos/octo/hello/pulls/9/merge"}
        expect: deny
        expect_asked: true
  - name: github GraphQL merge
    steps:
      - request:
          method: POST
          url: https://api.github.com/graphql
          body: '{"query":"mutation { mergePullRequest(input:{pullRequestId:\"x\"}) { clientMutationId } }"}'
        expect: deny
  - name: commenting doesn't ask
    steps:
      - request: {method: POST, url: "https://gitlab.com/api/v4/projects/7/merge_requests/42/notes", body: "{}"}
        expect: allow
        expect_asked: false
