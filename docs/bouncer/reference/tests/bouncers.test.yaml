# Tests for the rules and filter chains in bouncers.yaml.
# Cases use the default profile unless they set profile.
profile: default
gitlab_project_ids:
  mygroup/myproject: 1234
cases:
  - name: project API by path
    steps:
      - request: {url: "https://gitlab.com/api/v4/projects/mygroup%2Fmyproject/issues"}
        expect: allow
  - name: project API by numeric id
    steps:
      - request: {url: "https://gitlab.com/api/v4/projects/1234/merge_requests"}
        expect: allow
  - name: another project's API
    steps:
      - request: {url: "https://gitlab.com/api/v4/projects/999/merge_requests"}
        expect: deny
  - name: CI variables of the in-scope project are still off-limits
    steps:
      - request: {url: "https://gitlab.com/api/v4/projects/1234/variables"}
        expect: deny
  - name: adding members is off-limits
    steps:
      - request: {method: POST, url: "https://gitlab.com/api/v4/projects/mygroup%2Fmyproject/members", body: "{}"}
        expect: deny
  - name: deleting the project is off-limits
    steps:
      - request: {method: DELETE, url: "https://gitlab.com/api/v4/projects/1234"}
        expect: deny
  - name: lower-case method can't slip past the method deny rule
    steps:
      - request: {method: delete, url: "https://gitlab.com/api/v4/projects/1234"}
        expect: deny
  - name: closing an issue is fine
    steps:
      - request: {method: PUT, url: "https://gitlab.com/api/v4/projects/1234/issues/5", body: "{}"}
        expect: allow
  - name: group APIs are out of scope
    steps:
      - request: {url: "https://gitlab.com/api/v4/groups/mygroup/projects"}
        expect: deny
  - name: committing to main through the files API is not allowed
    steps:
      - request: {method: POST, url: "https://gitlab.com/api/v4/projects/1234/repository/files/README.md", body: '{"branch":"main"}'}
        expect: deny
  - name: reading files through the API is fine
    steps:
      - request: {url: "https://gitlab.com/api/v4/projects/1234/repository/files/README.md?ref=main"}
        expect: allow
  - name: unlisted project settings are denied
    steps:
      - request: {method: PUT, url: "https://gitlab.com/api/v4/projects/1234/protected_branches/main", body: "{}"}
        expect: deny
  - name: whoami
    steps:
      - request: {url: "https://gitlab.com/api/v4/user"}
        expect: allow
  - name: clone over https
    steps:
      - request: {method: POST, url: "https://gitlab.com/mygroup/myproject.git/git-upload-pack"}
        expect: allow
  - name: push a feature branch over https
    steps:
      - request: {method: POST, url: "https://gitlab.com/mygroup/myproject.git/git-receive-pack", git_push: [{ref: refs/heads/feature}]}
        expect: allow
  - name: push to main over https (branch filter runs before rules)
    steps:
      - request: {method: POST, url: "https://gitlab.com/mygroup/myproject.git/git-receive-pack", git_push: [{ref: refs/heads/main}]}
        expect: deny
        expect_reason: protected branch
  - name: merge needs approval
    steps:
      - request: {method: PUT, url: "https://gitlab.com/api/v4/projects/mygroup%2Fmyproject/merge_requests/3/merge"}
        expect: deny
        expect_asked: true
  - name: merge approved
    steps:
      - approve: true
        request: {method: PUT, url: "https://gitlab.com/api/v4/projects/mygroup%2Fmyproject/merge_requests/3/merge"}
        expect: allow
  - name: profile-wide redaction applies to gitlab responses
    steps:
      - request: {url: "https://gitlab.com/api/v4/projects/1234/jobs/9/trace"}
        upstream: {headers: {Content-Type: application/json}, body: '{"value":"glpat-abcdefghijklmnopqrstuvwx"}'}
        expect_body_excludes: [glpat-]
  - name: github repo in scope
    steps:
      - request: {url: "https://api.github.com/repos/myorg/myrepo/pulls"}
        expect: allow
  - name: github repo out of scope
    steps:
      - request: {url: "https://api.github.com/repos/myorg/secret/pulls"}
        expect: deny
  - name: github graphql guard
    steps:
      - request: {method: POST, url: "https://api.github.com/graphql", body: '{"query":"mutation { deleteRepository(input:{repositoryId:\"x\"}) { clientMutationId } }"}'}
        expect: deny
  - name: npm publish
    steps:
      - request: {method: PUT, url: "https://registry.npmjs.org/pkg", body: "{}"}
        expect: deny
  - name: ssh push to main
    steps:
      - ssh: {host: gitlab.com, user: git, command: "git-receive-pack 'mygroup/myproject.git'", git_push: [{ref: refs/heads/main}]}
        expect: deny
  - name: github push to a branch without rules
    steps:
      - request: {method: POST, url: "https://github.com/myorg/myrepo.git/git-receive-pack", git_push: [{ref: refs/heads/feature}]}
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/rules/branches/feature?per_page=100&page=1
            body: '[]'
            expect_credentials: [github]
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            body: '{"total_count": 0, "secrets": []}'
            expect_credentials: [github-audit]
        expect: allow
        expect_credentials: [github]
  - name: github push to a repo with repository Actions secrets is refused
    steps:
      - request: {method: POST, url: "https://github.com/myorg/myrepo.git/git-receive-pack", git_push: [{ref: refs/heads/feature}]}
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/rules/branches/feature?per_page=100&page=1
            body: '[]'
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            body: '{"total_count": 2, "secrets": []}'
            expect_credentials: [github-audit]
        expect: deny
        expect_reason: "has repository Actions secrets"
  - name: github ssh push looks up Actions secrets with the elevated token
    steps:
      - ssh: {host: github.com, user: git, command: "git-receive-pack 'myorg/myrepo.git'", git_push: [{ref: refs/heads/feature}]}
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/rules/branches/feature?per_page=100&page=1
            body: '[]'
            expect_credentials: [github]
          - url: https://api.github.com/repos/myorg/myrepo/actions/secrets?per_page=1
            body: '{"total_count": 0, "secrets": []}'
            expect_credentials: [github-audit]
        expect: allow
  - name: the agent reads Actions secrets with its own token, never the elevated one
    steps:
      - request:
          url: https://api.github.com/repos/myorg/myrepo/actions/secrets
          headers: {Authorization: "Bearer bouncer-placeholder-github-audit"}
        expect: allow
        expect_credentials: [github]
  - name: github push to a branch a ruleset restricts
    steps:
      - request: {method: POST, url: "https://github.com/myorg/myrepo.git/git-receive-pack", git_push: [{ref: refs/heads/staging}]}
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/rules/branches/staging?per_page=100&page=1
            body: '[{"type": "update"}]'
        expect: deny
        expect_reason: "GitHub rule 'update' protects branch 'staging'"
  - name: github ssh push to a branch a ruleset restricts
    steps:
      - ssh: {host: github.com, user: git, command: "git-receive-pack 'myorg/myrepo.git'", git_push: [{ref: refs/heads/staging}]}
        subrequests:
          - url: https://api.github.com/repos/myorg/myrepo/rules/branches/staging?per_page=100&page=1
            body: '[{"type": "update"}]'
            expect_credentials: [github]
        expect: deny
        expect_reason: "'update'"
  - name: github ssh push to another repo never looks anything up
    steps:
      - ssh: {host: github.com, user: git, command: "git-receive-pack 'myorg/other.git'", git_push: [{ref: refs/heads/feature}]}
        expect: deny
  - name: ssh clone of the project
    steps:
      - ssh: {host: gitlab.com, user: git, command: "git-upload-pack 'mygroup/myproject.git'"}
        expect: allow
  - name: ssh clone of another project
    steps:
      - ssh: {host: gitlab.com, user: git, command: "git-upload-pack 'mygroup/other.git'"}
        expect: deny
  - name: ssh shell on gitlab is not allowed
    steps:
      - ssh: {host: gitlab.com, user: git}
        expect: deny
  - name: sandbox shell asks
    steps:
      - ssh: {host: sandbox.dev.internal, user: agent}
        expect: deny
        expect_asked: true
  - name: sandbox shell approved
    steps:
      - approve: true
        ssh: {host: sandbox.dev.internal, user: agent}
        expect: allow
  - name: no port forwarding through the sandbox
    steps:
      - approve: true
        ssh: {host: sandbox.dev.internal, user: agent, target: "10.0.0.5:5432"}
        expect: deny
  - name: "locked-down: reads still work"
    profile: locked-down
    steps:
      - request: {url: "https://gitlab.com/api/v4/projects/1234/issues"}
        expect: allow
  - name: "locked-down: writes are blocked even in scope"
    profile: locked-down
    steps:
      - request: {method: POST, url: "https://gitlab.com/api/v4/projects/1234/issues", body: "{}"}
        expect: deny
        expect_status: 405
  - name: "locked-down: clone works"
    profile: locked-down
    steps:
      - request: {method: POST, url: "https://gitlab.com/mygroup/myproject.git/git-upload-pack"}
        expect: allow
  - name: a commit for a claimed repository is signed
    claims: {repository: [github.com/myorg/myrepo]}
    steps:
      - request:
          method: POST
          url: "https://signer.bouncer.internal/openpgp/sign?key=0123456789abcdef&repository=github.com%2Fmyorg%2Fmyrepo"
          body: "tree 9bedf67800b2923982bdf60c89c57ce6986c4c5b\nparent bd3539c4e2f1a0b1c2d3e4f5a6b7c8d9e0f1a2b3\nauthor Agent <agent@example.com> 1764000000 +0000\ncommitter Agent <agent@example.com> 1764000000 +0000\n\nAdd a feature.\n"
        expect: allow
        expect_claim_requested: false
        expect_body_contains: ["BEGIN PGP SIGNATURE"]
  - name: a tag for a claimed repository is signed
    claims: {repository: [github.com/myorg/myrepo]}
    steps:
      - request:
          method: POST
          url: "https://signer.bouncer.internal/openpgp/sign?key=0123456789ABCDEF&repository=github.com%2Fmyorg%2Fmyrepo"
          body: "object bd3539c4e2f1a0b1c2d3e4f5a6b7c8d9e0f1a2b3\ntype commit\ntag v1.2.3\ntagger Agent <agent@example.com> 1764000000 +0000\n\nRelease v1.2.3.\n"
        expect: allow
  - name: an unclaimed repository signs nothing when the operator denies it
    claims: {repository: [github.com/myorg/myrepo]}
    steps:
      - request:
          method: POST
          url: "https://signer.bouncer.internal/openpgp/sign?key=0123456789ABCDEF&repository=github.com%2Fsomeone%2Felse"
          body: "tree 9bedf67800b2923982bdf60c89c57ce6986c4c5b\nauthor Agent <agent@example.com> 1764000000 +0000\ncommitter Agent <agent@example.com> 1764000000 +0000\n\nmsg\n"
        claim_answer: deny
        expect: deny
        expect_claim_requested: {type: repository, value: github.com/someone/else}
  - name: arbitrary bytes are never signed
    claims: {repository: [github.com/myorg/myrepo]}
    steps:
      - request:
          method: POST
          url: "https://signer.bouncer.internal/openpgp/sign?key=0123456789ABCDEF&repository=github.com%2Fmyorg%2Fmyrepo"
          body: "I approve this release.\n"
        expect: deny
        expect_reason: not an unsigned git commit or tag
  - name: an already-signed commit is refused
    claims: {repository: [github.com/myorg/myrepo]}
    steps:
      - request:
          method: POST
          url: "https://signer.bouncer.internal/openpgp/sign?key=0123456789ABCDEF&repository=github.com%2Fmyorg%2Fmyrepo"
          body: "tree 9bedf67800b2923982bdf60c89c57ce6986c4c5b\nauthor Agent <agent@example.com> 1764000000 +0000\ncommitter Agent <agent@example.com> 1764000000 +0000\ngpgsig -----BEGIN PGP SIGNATURE-----\n \n -----END PGP SIGNATURE-----\n\nmsg\n"
        expect: deny
        expect_reason: already signed
  - name: a key the signer does not hold is refused
    claims: {repository: [github.com/myorg/myrepo]}
    steps:
      - request:
          method: POST
          url: "https://signer.bouncer.internal/openpgp/sign?key=1111111111111111&repository=github.com%2Fmyorg%2Fmyrepo"
          body: "tree 9bedf67800b2923982bdf60c89c57ce6986c4c5b\nauthor Agent <agent@example.com> 1764000000 +0000\ncommitter Agent <agent@example.com> 1764000000 +0000\n\nmsg\n"
        expect: deny
        expect_reason: unknown signing key
