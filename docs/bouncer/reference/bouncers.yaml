# Reference overlay for ~/.config/agentcon.d/bouncers.yaml.
# A tour of every bouncer feature, not a policy to run as is.
# Adds a named reference bouncer and binds it on a reference context.
# Add root and agent to that context to run with it.
# Projects, repos, hosts, and credential items are placeholders.
# Filter paths are relative to this directory, starting with ts/.
# Copy the whole directory, tests/ included, or delete the tests: line.
# relativeDir fails the config load when tests/ is missing.
# Run the tests with: agentcon bouncer test --context reference

bouncers:
  reference:
    default_profile: default
    tests: '{{ relativeDir "tests" }}'

    prompts:
      timeout: 2m      # unanswered prompts expire after this; an expired approval is a deny
      notify: true     # desktop notification for each pending prompt
      terminal: true   # prompt in the `bouncer serve` terminal
      cli: true        # allow `bouncer answer/approve/deny/decline` and `agentcon run` to answer

    # Bitwarden accounts that source: bitwarden slots name.
    # Each vault is synced and unlocked once for this process.
    # bitwarden:
    #   me:
    #     email: me@example.com
    #     # server: https://vault.example.com
    #     # Without password, the bouncer prompts for the master password.
    #     # password:                    # env, file, keyring, command, or provided
    #     #   source: command
    #     #   command: [rbw, get, bitwarden-master]

    # Where secrets come from. The agent only ever sees placeholders.
    # Each credential is a composite of slots (token, username, password, private_key).
    # Each slot is a source plus optional JSONPath on the source payload.
    # allow (required) lists the kinds of requests that may use it:
    #   agent       the agent's own requests and SSH connections
    #   subrequest  requests a filter makes with subrequest()
    #   internal    handlers inside the bouncer, such as the OpenPGP signer; alone
    # None of them lets filter code read the secret.
    credentials:
      gitlab:
        allow: [agent]
        token:
          source: keyring
        export_env: [GITLAB_TOKEN]       # glab etc. see a placeholder token
      github:
        allow: [agent, subrequest]       # github-branch-rules looks up with it too
        # The escape hatch: any command that prints the secret on stdout.
        token:
          source: command
          command: [bw, get, password, github-agent-pat]
        cache: 15m
        export_env: [GH_TOKEN]
      # An elevated credential: only filter subrequests may use it, and only
      # on a rule that lists it in subrequest.credentials. The agent can
      # never send it, even by naming its placeholder.
      github-audit:
        allow: [subrequest]
        token:
          source: command
          command: [bw, get, password, github-audit-pat]
      gitlab-ssh:
        allow: [agent]
        private_key:
          source: ssh-agent              # keys from your running ssh-agent
      github-ssh:
        allow: [agent]
        private_key:
          source: ssh-agent
      sandbox-key:
        allow: [agent]
        private_key:
          source: file
          file: ~/.ssh/id_ed25519_sandbox
      slack:
        allow: [agent]
        token:
          source: env                    # read from the daemon's environment
          env: SLACK_BOT_TOKEN
        export_env: [SLACK_TOKEN]
      # An OpenPGP key for signing commits and tags.
      # allow: [internal] keeps it inside the bouncer: no service may send it,
      # and it may not set export_env. Only a signer service may name it.
      signing:
        allow: [internal]
        private_key:
          source: file                   # an armored private key
          file: ~/.config/agentcon/signing-key.asc
        password:                        # its passphrase; omit for an unprotected key
          source: keyring
      # gitlab-bw:
      #   token:
      #     source: bitwarden
      #     account: me                  # a key of the bitwarden map above
      #     item: GitLab                 # name or id; folder disambiguates
      #     path: $.login.password       # decrypted cipher JSON
      #   allow: [agent]
      #   export_env: [GITLAB_TOKEN]

    profiles:
      default:
        # Hosts without an http entry below are tunneled untouched (no inspection,
        # no credentials). Leftover paths on an intercepted host follow this too:
        # tunnel forwards them without the credential. Set `unmatched: deny` to
        # block both, or `default: deny` on one http entry.
        unmatched: tunnel

        # Profile-wide filters run first for every intercepted request.
        filters:
          - ts/filters/redact-response.ts

        http:
          # "It should have access to only this project using my GitLab
          # credential; all other APIs should be blocked."
          - name: gitlab
            hosts: [gitlab.com]
            # credentials lists what may be sent to these hosts; inject names
            # the one it attaches.
            credentials: [gitlab]
            inject:
              credential: gitlab
              header: PRIVATE-TOKEN
              git: {basic: {username: oauth2}}   # git over HTTPS wants Basic auth
            # Rules name projects by path, but API URLs often use the numeric
            # ID. The bouncer looks the ID up with this credential, which
            # must allow agent.
            lookup_credential: gitlab
            default: deny
            # First matching rule wins. default: deny keeps leftover GitLab paths
            # off-limits even though the profile unmatched mode is tunnel.
            # gitlab_project scopes WHICH project; subpaths limit WHAT the agent
            # may do there. This is an allowlist: endpoints not listed (CI
            # variables, members, tokens, webhooks, settings, deleting the
            # project...) are denied, including ones GitLab adds later.
            # A rule's filters run only after that rule matches with allow.
            rules:
              - action: allow
                methods: [GET]
                gitlab_project: {path: mygroup/myproject, subpaths: [""]}   # project info
              - action: allow
                methods: [PUT]
                gitlab_project: {path: mygroup/myproject, subpaths: ["merge_requests/*/merge"]}
                filters: [ts/filters/require-approval-merge.ts]
              - action: allow
                gitlab_project:
                  path: mygroup/myproject
                  subpaths: ["issues/**", "merge_requests/**", "pipelines/**", "pipeline",
                             "jobs/**", "labels/**", "milestones/**", "releases/**", "search"]
              # Repository contents: read via the API, write only via git push.
              # (The commit and files APIs can put commits on main without a push.)
              - action: allow
                methods: [GET]
                gitlab_project: {path: mygroup/myproject, subpaths: ["repository/**"]}
              - action: allow
                git: {}
                gitlab_project: mygroup/myproject   # clone, fetch, push
                filters:
                  - path: ts/filters/git-protect-branches.ts
                    config: {branches: [main, "release/*"]}
              - action: allow
                methods: [GET]
                path: /api/v4/user                  # tools call this to check auth
              - action: allow
                methods: [GET]
                path: /api/v4/version

          - name: github
            hosts: [github.com, api.github.com, uploads.github.com]
            credentials: [github, github-audit]
            inject:
              credential: github
              bearer: true
              git: {basic: {username: x-access-token}}
            default: deny
            rules:
              # Only github-ci-safety's lookups match this rule, and only they
              # may use github-audit, and only here. It comes first, so an
              # agent request to the same path falls through to the rules
              # below and their ordinary token.
              - action: allow
                methods: [GET]
                github_repo: [myorg/myrepo]
                github_subpaths: ["actions/secrets"]
                subrequest:
                  filters: [github-ci-safety, github-ci-safety-ssh]   # filter placement ids
                  credentials: [github-audit]
              - action: allow
                git: {}
                github_repo: [myorg/myrepo]
                filters:
                  - path: ts/filters/git-protect-branches.ts
                    config: {branches: [main, "release/*"]}
                  - path: ts/filters/push-rate-limit.ts
                    config: {max: 20, window: 1h}
                  # Asks GitHub for the branch rules in force now, through a
                  # subrequest to api.github.com. The github_repo rule below
                  # allows that lookup and injects the token.
                  - ts/filters/github-branch-rules.ts
                  # Refuses the push when the repo has Actions secrets. Its
                  # lookup uses github-audit through the first rule. id names
                  # this placement for subrequest.filters, and is unique in
                  # the policy.
                  - path: ts/filters/github-ci-safety.ts
                    id: github-ci-safety
              - action: allow
                methods: [PUT]
                github_repo: [myorg/myrepo]
                github_subpaths: ["pulls/*/merge"]
                filters: [ts/filters/require-approval-merge.ts]
              - action: allow
                github_repo: [myorg/myrepo]
              - action: allow
                methods: [GET]
                path: /user
              # `gh` uses GraphQL for most commands. GraphQL isn't scoped by URL,
              # so this lets the token reach every repo it can access; the
              # graphql guard on this rule limits what it can do there. Remove this
              # rule for strict repo scoping (gh will then only partly work).
              - action: allow
                methods: [POST]
                path: /graphql
                filters:
                  - ts/filters/github-graphql-guard.ts
                  - ts/filters/require-approval-merge.ts

          # A pseudo service. Its last step signs inside the bouncer instead of
          # forwarding, and nothing is ever sent to this host. The agent's
          # git-sign helper posts the object git wants signed here; agentcon
          # run sets BOUNCER_SIGNER_URL to https://<first host>/openpgp/sign.
          # The signer only signs unsigned git commits and tags, with the key
          # whose id git asks for (user.signingkey).
          # Without a filter it signs for every session, so scope it.
          - name: signing
            hosts: [signer.bouncer.internal]
            signer:
              openpgp:
                keys:
                  - {id: 0123456789ABCDEF, credential: signing}
            filters: [ts/filters/signing-repository-scope.ts]

          # A credential-less service: intercepted only to apply a filter.
          - name: npm
            hosts: [registry.npmjs.org]
            filters: [ts/filters/npm-no-publish.ts]

          - name: slack
            hosts: [slack.com]
            credentials: [slack]
            inject: {credential: slack, bearer: true}
            filters:
              - path: ts/filters/slack-channel-allowlist.ts
                config: {channels: [C0123AGENT]}

        ssh:
          # git over SSH, with the same branch protection as HTTPS.
          - name: gitlab-ssh
            hosts: [gitlab.com]
            user: git
            credential: gitlab-ssh
            allow: [git]
            rules:
              - action: allow
                gitlab_project: mygroup/myproject
                filters:
                  - path: ts/filters/git-protect-branches.ts
                    config: {branches: [main, "release/*"]}

          # The same GitHub lookups guard SSH pushes. Their subrequests go to
          # api.github.com through the github http service. This placement
          # of github-ci-safety has its own id.
          - name: github-ssh
            hosts: [github.com]
            user: git
            credential: github-ssh
            allow: [git]
            rules:
              - action: allow
                github_repo: [myorg/myrepo]
                filters:
                  - ts/filters/github-branch-rules.ts
                  - path: ts/filters/github-ci-safety.ts
                    id: github-ci-safety-ssh

          # A sandbox VM the agent may log into. Once connected it can do
          # anything there, so a human approves each session. Agent forwarding
          # is always refused; port forwards only if `forward` is allowed.
          - name: sandbox
            hosts: [sandbox.dev.internal]
            user: agent
            credential: sandbox-key
            allow: [shell, exec, sftp]
            rules:
              - action: ask
                prompt: "Let the agent into sandbox.dev.internal? Once in, it can do anything there."

      # For untrusted repos: nothing leaves except the listed services and
      # tunnels. Inherits everything from default.
      locked-down:
        extends: default
        unmatched: deny
        tunnel:
          - api.anthropic.com     # the agent's own model API
          - "*.githubusercontent.com"
        filters:
          - path: ts/filters/read-only.ts
            config:
              except: ["POST /graphql", "POST /-/npm/v1/security/*"]

contexts:
  reference:
    bouncer: reference
