version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nakedret
    - nilerr
    - nolintlint
    - revive
    - sqlclosecheck
    - staticcheck
    - unparam
    - unused
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    errcheck:
      exclude-functions:
        # Filter bindings define properties on objects they just created,
        # which goja cannot refuse.
        - (*github.com/dop251/goja.Object).Set
        - (*github.com/dop251/goja.Object).DefineDataProperty
        - (*github.com/dop251/goja.Object).DefineAccessorProperty
    goconst:
      ignore-tests: true
    gosec:
      excludes:
        # Unchecked errors belong to errcheck, which honors exclude-functions.
        - G104
  exclusions:
    generated: lax
    presets:
      - comments
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
