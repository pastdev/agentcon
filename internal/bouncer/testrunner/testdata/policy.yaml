default_profile: open
credentials:
  tok:
    allow: [agent, subrequest]
    token: {source: env, env: TESTRUNNER_TOKEN}
profiles:
  open:
    http:
      - name: example
        hosts: [example.com]
        default: allow
  closed:
    http:
      - name: example
        hosts: [example.com]
        default: deny
  tunnel:
    unmatched: tunnel
    http:
      - name: api
        hosts: [api.example.com]
        credentials: [tok]
        inject: {credential: tok, bearer: true}
        rules:
          - action: allow
            path: /in
  lookup:
    unmatched: tunnel
    http:
      - name: api
        hosts: [api.example.com]
        credentials: [tok]
        inject: {credential: tok, bearer: true}
        filters:
          - path: lookup.ts
        rules:
          - action: allow
            path: /in
          - action: allow
            methods: [GET]
            path: /rules/**
          - action: deny
            path: /secret/**
