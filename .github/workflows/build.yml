---
name: build

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  pull_request:
  push:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        cache: true
    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
      with:
        version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        cache: true
    - run: go version
    - name: Keep ad_hoc out of the build
      run: |
        if go list ./... | grep /ad_hoc/; then
          echo "Go files under ad_hoc/issue-<num>/ need //go:build issue<num>" >&2
          exit 1
        fi
    - run: go test -race ./...

  version:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
    - lint
    - test
    outputs:
      release-version: ${{ steps.parse.outputs.release-version }}
    runs-on: ubuntu-latest
    steps:
    - id: parse
      env:
        GITHUB_REF: ${{ github.ref }}
      name: Parse version from tag ${{ github.ref }}
      run: |
        if [[ "${GITHUB_REF}" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "release-version=${BASH_REMATCH[1]}" >>"${GITHUB_OUTPUT}"
        fi

  release:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_DIR: .github-release
      RELEASE_VERSION: ${{ needs.version.outputs.release-version }}
    if: needs.version.outputs.release-version
    needs: version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Build release artifacts version ${{ env.RELEASE_VERSION }}
      run: |
        mkdir -p "${RELEASE_DIR}"
        for PLATFORM in windows linux darwin; do
          EXTENSION=""
          if [[ "${PLATFORM}" == "windows" ]]; then
            EXTENSION=".exe"
          fi
          export GOOS="${PLATFORM}"
          export GOARCH=amd64
          export CGO_ENABLED=0

          OUT_FILE="${RELEASE_DIR}/agentcon-${PLATFORM}${EXTENSION}"
          echo "Creating ${OUT_FILE} (${RELEASE_VERSION})"
          go build \
            -ldflags "-X github.com/pastdev/agentcon/pkg/version.version=${RELEASE_VERSION}" \
            -o "${OUT_FILE}" \
            ./cmd/agentcon
        done
        ls -lrt "${RELEASE_DIR}"
    - name: Create release ${{ env.RELEASE_VERSION }}
      run: |
        gh release create "${RELEASE_VERSION}" \
          --title "${RELEASE_VERSION}" \
          "${RELEASE_DIR}/agentcon-darwin" \
          "${RELEASE_DIR}/agentcon-linux" \
          "${RELEASE_DIR}/agentcon-windows.exe"

