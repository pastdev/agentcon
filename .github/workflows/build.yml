---
name: build

defaults:
  run:
    shell: bash

on:
  pull_request:
  push:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - run: go version
    - run: go test ./...
